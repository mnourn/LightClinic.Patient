services:
  # SQL Server Database
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: medtech-sql-server
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=123456a@A
      - MSSQL_PID=Developer
    ports:
      - "1433:1433"
    volumes:
      - sql_data:/var/opt/mssql
    restart: unless-stopped
    networks:
      - medtech-network
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P '123456a@A' -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  # Web API Application
  webapi:
    build:
      context: .
      dockerfile: medtech.Patient.Auth.WebApi/Dockerfile
    image: medtech-patient-auth-api:latest
    container_name: medtech-patient-auth-api
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      # Override connection string to use containerized SQL Server
      - ConnectionStrings__DefaultConnection=Server=db,1433;Database=Patient.Booking;User ID=sa;Password=123456a@A;TrustServerCertificate=True;
    restart: unless-stopped
    networks:
      - medtech-network

volumes:
  sql_data:

networks:
  medtech-network:
    driver: bridge

